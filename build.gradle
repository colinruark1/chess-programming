plugins {
    id 'java'
    id 'application'
}

repositories {
}

application {
    mainClass = 'mybot.MyBot'
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }

    doLast {
        copy {
            from {
                configurations.runtimeClasspath
            }
            into "$buildDir/libs"
        }
    }
}
